<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Comic</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <!-- Comic Cover -->
        <img id="comicCover" src="" alt="Comic Cover">


        <!-- Comic Information -->
        <h1 id="comicName">Loading...</h1>

        <p id="comicDescription"></p>


        <!-- Tags -->
        <div id="comicTags"></div>


        <!-- Status -->
        <p>
            <strong>Status:</strong>
            <span id="comicStatus"></span>
        </p>


        <!-- Last Updated -->
        <p>
            <strong>Last Updated:</strong>
            <span id="lastUpdated"></span>
        </p>


        <!-- Navigation -->
        <button onclick="startReading()">
            Start Reading
        </button>

        <button onclick="goToVolumes()">
            Volumes
        </button>

        <button onclick="goToAbout()">
            About
        </button>

    </main>


    <script src="script.js"></script>

</body>

</html>
