<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Comic</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        

        <!-- Comic Cover -->
        <img id="cover" src="" alt="Comic Cover">

        <!-- Comic Name -->

        <h1 id="name">Loading...</h1>

        <!-- Comic Description -->

        <p id="description"></p>


        <!-- Tags NO -->
        <div id="comicTags"></div>


        <!-- Status NOPE -->
        <p>
            <strong>Status:</strong>
            <span id="status"></span>
        </p>


        <!-- Last Updated NO{E} -->
        <p>
            <strong>Last Updated:</strong>
            <span id="lastUpdated"></span>
        </p>


        <!-- Navigation -->

        <button onclick="goToVolumes()">
            Volumes
        </button>



    </main>


    <script src="script.js"></script>

</body>

</html>
